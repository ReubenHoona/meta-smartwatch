# aurora/eos: the Halium-13 container serves AIDL HALs (e.g. android.hardware.gnss
# IGnss) on /dev/binder with the Android 13 wire protocol and service manager
# (libgbinder's API level 33 preset). Only /dev/binder is set here; hwbinder
# (HIDL) keeps the ApiLevel defaults from /etc/gbinder.conf.
[Protocol]
/dev/binder = aidl3

[ServiceManager]
/dev/binder = aidl3
